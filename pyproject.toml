[project]
name = "harbour"
version = "0.2.0"
description = "Harbour Bank: hands-on banking data-stack workshops from ReadSigil"
requires-python = ">=3.10"
dependencies = [
  "confluent-kafka>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
harbour = "harbour.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harbour", "harbour.checks"]

[tool.setuptools.package-data]
harbour = ["data/*.json"]
